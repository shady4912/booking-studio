<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>Sign in · Booking Studio</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
      .login-card{width:min(100%,440px);padding:36px;background:#fff;border:1px solid #e8eaf0;border-radius:20px;box-shadow:0 20px 70px #1f2c4512}
      .login-card h1{margin:8px 0;font-size:28px}.login-card p{color:#697386;line-height:1.55}
      .login-card label{display:block;margin:24px 0 8px;font-weight:650}
      .login-card input{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:10px;font:inherit}
      .login-card button{width:100%;margin-top:16px}.login-status{min-height:24px;font-size:14px}
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <section class="login-card">
        <span class="eyebrow">CASAHELP WORKSPACE</span>
        <h1>Sign in to Booking Studio</h1>
        <p>Sign in with an authorized administrator email and password.</p>
        <form id="login-form">
          <label for="email">Administrator email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
          <button class="button primary" type="submit">Sign in</button>
        </form>
        <button class="button" id="email-link-toggle" type="button">Use an email sign-in link instead</button>
        <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
